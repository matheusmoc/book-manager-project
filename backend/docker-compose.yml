version: '3.8'
services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      JWT_SECRET: super_secret_key_change_me
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: user
      DATABASE_PASSWORD: password
      DATABASE_NAME: bookmanager
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

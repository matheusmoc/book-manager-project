version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-manager-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    networks:
      - book-manager-network
    depends_on:
      - backend

  backend:
    image: book-manager-backend:latest
    container_name: book-manager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - book-manager-network

networks:
  book-manager-network:
    driver: bridge
